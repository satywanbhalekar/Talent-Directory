name: Build Push and Deploy to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: b17
  ECR_REGISTRY: 208851973284.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: b17
  FRONTEND_IMAGE: 208851973284.dkr.ecr.ap-south-1.amazonaws.com/b17:frontend-latest
  BACKEND_IMAGE: 208851973284.dkr.ecr.ap-south-1.amazonaws.com/b17:backend-latest
  K8S_NAMESPACE: talent-app

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ======================================================
      # COMMENT 1: CODE LINTING - Ensures code quality before building
      # ======================================================
      - name: Lint frontend code (ESLint)
        run: |
          cd talent-directory
          npm install
          npm run lint || echo "Frontend linting completed with warnings"

      - name: Lint backend code (ESLint)
        run: |
          cd backend
          npm install
          npm run lint || echo "Backend linting completed with warnings"

      # ======================================================
      # COMMENT 2: DOCKERFILE LINTING - Checks Dockerfile best practices
      # ======================================================
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: talent-directory/Dockerfile

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: Build frontend image
        run: |
          docker build -t $FRONTEND_IMAGE ./talent-directory

      - name: Build backend image
        run: |
          docker build -t $BACKEND_IMAGE ./backend

      # ======================================================
      # COMMENT 3: VULNERABILITY SCANNING - Blocks deployment if critical/high vulnerabilities found
      # ======================================================
      - name: Scan frontend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Scan backend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push frontend image
        run: |
          docker push $FRONTEND_IMAGE

      - name: Push backend image
        run: |
          docker push $BACKEND_IMAGE

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

      - name: Replace image placeholders in k8s manifests
        run: |
          sed -i "s|IMAGE_FRONTEND|$FRONTEND_IMAGE|g" k8s/frontend-deployment.yaml
          sed -i "s|IMAGE_BACKEND|$BACKEND_IMAGE|g" k8s/backend-deployment.yaml

      - name: Deploy namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Deploy config and secret
        run: |
          kubectl apply -f k8s/frontend-configmap.yaml
          kubectl apply -f k8s/backend-secret.yaml

      - name: Deploy backend and frontend
        run: |
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml

      - name: Verify deployment
        run: |
          kubectl get all -n $K8S_NAMESPACE